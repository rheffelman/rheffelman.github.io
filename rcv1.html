<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RCV Data Analysis</title>

  <!-- Shared, uniform header + global tokens -->
  <link rel="stylesheet" href="./header.css"/>

  <!-- Tableau embed -->
  <script type="module" src="https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js"></script>

  <!-- MathJax (only if you actually use LaTeX in this page) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>

  <!-- Markdown converter -->
  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js" defer></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: visible;
    }

    .page-title {
      max-width: 1000px;
      margin: 24px auto 0;
      padding: 0 16px;
      font-family: gilroy, ss, sans-serif;
      font-size: 1.6rem;
      color: var(--title);
      text-align: center;
    }

    .md-wrap {
      max-width: 1000px;
      margin: 20px auto 60px;
      padding: 0 16px;
    }

    #markdown-content {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      line-height: 1.8;
      overflow-x: auto;
    }

    /* Markdown typography */
    #markdown-content h1,
    #markdown-content h2,
    #markdown-content h3,
    #markdown-content h4 {
      color: var(--title);
      margin: 1.2rem 0 .6rem;
      font-family: gilroy, ss, ui-sans-serif, system-ui;
    }
    #markdown-content p { margin: 1rem 0; }
    #markdown-content ul,
    #markdown-content ol {
      margin: .6rem 0 .6rem 1.25rem;
      padding-left: 1rem;
    }
    #markdown-content li { margin: .35rem 0; }
    #markdown-content a { text-decoration: underline; }

    #markdown-content code,
    #markdown-content pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .15rem .35rem;
    }
    #markdown-content pre {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .75rem 1rem;
      overflow-x: auto;
    }

    #markdown-content blockquote {
      border-left: 4px solid var(--accent, #1a73e8);
      padding-left: 14px;
      margin: 1rem 0;
      color: var(--muted);
    }

    /* Tableau viz styling */
    .viz-wrap {
      --w: 1920;
      --h: 1080;
      --scale: 0.5;
      display: flex;
      justify-content: center;
      height: calc(var(--h) * 1px * var(--scale));
      margin: 30px 0;
    }

    .viz-scaler {
      width: calc(var(--w) * 1px);
      height: calc(var(--h) * 1px);
      transform: scale(var(--scale));
      transform-origin: top center;
    }

    .viz {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Uniform header -->
  <header>
    <a class="github-icon" href="https://github.com/rheffelman/rheffelman.github.io">
      <img src="../materials/github-mark-white.png" alt="GitHub icon"/>
    </a>
    <h1><a href="../index.html">rheffelman.github.io</a></h1>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../html/about.html">About</a></li>
        <li><a href="../html/projects.html">Projects</a></li>
      </ul>
    </nav>
  </header>

  <!-- Page-specific title -->
  <div class="page-title">RCV Data Analysis</div>

  <!-- Markdown container -->
  <div class="md-wrap">
    <div id="markdown-content">Loading…</div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const converter = new showdown.Converter({
        tables: true,
        simplifiedAutoLink: true,
        strikethrough: true,
        tasklists: true
      });

      fetch('./markdowns/rcv.md')
        .then(r => r.text())
        .then(md => {
          // Convert Markdown to HTML
          let html = converter.makeHtml(md);

          // Replace Tableau URLs with embedded dashboards
          html = html
            .replace(
              /https:\/\/public\.tableau\.com\/views\/FinalProjectHeffelmanRyan\/TheData[^\s)"]*/g,
              `<div class="viz-wrap" style="--scale:0.5;">
                <div class="viz-scaler">
                  <tableau-viz class="viz"
                    src="https://public.tableau.com/views/FinalProjectHeffelmanRyan/TheData?:showVizHome=no&:embed=true"
                    toolbar="bottom"
                    hide-tabs
                    loading="eager">
                  </tableau-viz>
                </div>
              </div>`
            )
            .replace(
              /https:\/\/public\.tableau\.com\/views\/FinalProjectHeffelmanRyan\/VotingSystemTabulations[^\s)"]*/g,
              `<div class="viz-wrap" style="--scale:0.5;">
                <div class="viz-scaler">
                  <tableau-viz class="viz"
                    src="https://public.tableau.com/views/FinalProjectHeffelmanRyan/VotingSystemTabulations?:showVizHome=no&:embed=true"
                    toolbar="bottom"
                    hide-tabs
                    loading="eager">
                  </tableau-viz>
                </div>
              </div>`
            )
            .replace(
              /https:\/\/public\.tableau\.com\/views\/FinalProjectHeffelmanRyan\/PairwiseComparisons[^\s)"]*/g,
              `<div class="viz-wrap" style="--scale:0.5;">
                <div class="viz-scaler">
                  <tableau-viz class="viz"
                    src="https://public.tableau.com/views/FinalProjectHeffelmanRyan/PairwiseComparisons?:language=en-US&:sid=&:redirect=auth&:display_count=n&:origin=viz_share_link"
                    toolbar="bottom"
                    hide-tabs
                    loading="eager">
                  </tableau-viz>
                </div>
              </div>`
            );

          // Insert rendered HTML
          const el = document.getElementById('markdown-content');
          el.innerHTML = html;

          // Re-render MathJax if needed
          if (window.MathJax && MathJax.startup) {
            MathJax.startup.promise.then(() => MathJax.typeset([el]));
          }
        })
        .catch(err => {
          console.error('Error fetching Markdown:', err);
          document.getElementById('markdown-content').textContent = 'Failed to load RCVDataAnalysis.md';
        });
    });
  </script>
</body>
</html>
