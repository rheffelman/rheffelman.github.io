<title>Swing Sync — Enhancement Shaman Timer Visualizer</title>
<style>
  :root {
    --bg: #0a0e13;
    --bg-grid: #0d1218;
    --surface: #121922;
    --surface-2: #1a2430;
    --border: #24303d;
    --text: #e8eef5;
    --text-dim: #7e93a8;
    --text-faint: #4d5f70;
    --mh: #3ecbff;
    --mh-glow: rgba(62, 203, 255, 0.55);
    --oh: #ffb03e;
    --oh-glow: rgba(255, 176, 62, 0.55);
    --sync: #b98bff;
    --sync-glow: rgba(185, 139, 255, 0.6);
    --sync-dim: #7a5bb0;
    --good: #5be08a;
    --track: #0e1620;
  }

  :root[data-theme="light"] {
    --bg: #eef1f5;
    --bg-grid: #e6eaf0;
    --surface: #ffffff;
    --surface-2: #f3f6fa;
    --border: #d6dde5;
    --text: #16202c;
    --text-dim: #56697c;
    --text-faint: #93a2b1;
    --mh: #0b8fc9;
    --mh-glow: rgba(11, 143, 201, 0.35);
    --oh: #c97a12;
    --oh-glow: rgba(201, 122, 18, 0.32);
    --sync: #7c4fd1;
    --sync-glow: rgba(124, 79, 209, 0.4);
    --sync-dim: #9a7fd0;
    --good: #1e9a54;
    --track: #e3e8ee;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef1f5;
      --bg-grid: #e6eaf0;
      --surface: #ffffff;
      --surface-2: #f3f6fa;
      --border: #d6dde5;
      --text: #16202c;
      --text-dim: #56697c;
      --text-faint: #93a2b1;
      --mh: #0b8fc9;
      --mh-glow: rgba(11, 143, 201, 0.35);
      --oh: #c97a12;
      --oh-glow: rgba(201, 122, 18, 0.32);
      --sync: #7c4fd1;
      --sync-glow: rgba(124, 79, 209, 0.4);
      --sync-dim: #9a7fd0;
      --good: #1e9a54;
      --track: #e3e8ee;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--bg-grid), transparent),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
  }

  .app {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: center;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .eyebrow svg { width: 14px; height: 14px; fill: var(--sync); }

  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }

  .panel {
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px 22px;
  }

  .timers {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .timer-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .timer-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .timer-name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.mh { background: var(--mh); box-shadow: 0 0 8px var(--mh-glow); }
  .dot.oh { background: var(--oh); box-shadow: 0 0 8px var(--oh-glow); }

  .readout {
    font-family: "Cascadia Code", "Consolas", "SFMono-Regular", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--text-dim);
  }

  .readout b { color: var(--text); font-weight: 600; }

  .bar-track {
    position: relative;
    height: 26px;
    background: var(--track);
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }

  .bar-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    border-radius: 6px 0 0 6px;
  }

  .bar-fill.mh { background: linear-gradient(90deg, color-mix(in srgb, var(--mh) 40%, transparent), var(--mh)); }
  .bar-fill.oh { background: linear-gradient(90deg, color-mix(in srgb, var(--oh) 40%, transparent), var(--oh)); }

  .bar-fill::after {
    content: "";
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 3px;
  }
  .bar-fill.mh::after { background: #fff; box-shadow: 0 0 10px 2px var(--mh-glow); }
  .bar-fill.oh::after { background: #fff; box-shadow: 0 0 10px 2px var(--oh-glow); }

  .midline {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 1px;
    background: var(--text-faint);
    opacity: 0.6;
  }

  .speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .speed-input {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--track);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
  }

  .speed-input input {
    width: 48px;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .speed-input input:focus { outline: none; }
  .speed-input span { color: var(--text-faint); font-size: 12px; }
  .speed-input input::-webkit-outer-spin-button,
  .speed-input input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .speed-input input[type="number"] { -moz-appearance: textfield; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip {
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .chip:hover { color: var(--text); border-color: var(--text-faint); }
  .chip:focus-visible { outline: 2px solid var(--sync); outline-offset: 2px; }
  .chip.active.mh-active { color: var(--mh); border-color: var(--mh); background: color-mix(in srgb, var(--mh) 12%, transparent); }
  .chip.active.oh-active { color: var(--oh); border-color: var(--oh); background: color-mix(in srgb, var(--oh) 12%, transparent); }

  .controls-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 4px;
  }

  .ctl-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .ctl-btn:hover { color: var(--text); border-color: var(--text-faint); }
  .ctl-btn:focus-visible { outline: 2px solid var(--sync); outline-offset: 2px; }

  .sync-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 26px 22px 24px;
  }

  .sync-btn {
    position: relative;
    width: 168px;
    height: 168px;
    border-radius: 20px;
    border: 2px solid var(--sync-dim);
    background:
      radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--sync) 22%, transparent), transparent 70%),
      var(--surface-2);
    color: var(--text);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: inherit;
    transition: border-color 0.15s ease, transform 0.05s ease;
  }
  .sync-btn:hover { border-color: var(--sync); }
  .sync-btn:focus-visible { outline: 2px solid var(--sync); outline-offset: 3px; }

  .sync-btn svg { width: 46px; height: 46px; fill: var(--sync); }

  .sync-btn .label {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .sync-btn .sub {
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
  }

  .sync-btn.pressed {
    animation: press 0.38s ease-out;
  }

  @keyframes press {
    0%   { transform: scale(1); box-shadow: 0 0 0 0 var(--sync-glow); border-color: var(--sync); }
    30%  { transform: scale(0.92); box-shadow: 0 0 0 6px var(--sync-glow); border-color: var(--sync); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 transparent; border-color: var(--sync-dim); }
  }

  .sync-btn.pressed svg { animation: flash 0.38s ease-out; }
  @keyframes flash {
    0% { fill: var(--sync); }
    30% { fill: #ffffff; }
    100% { fill: var(--sync); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sync-btn.pressed, .sync-btn.pressed svg { animation: none; }
  }
</style>

<div class="app">
  <header>
    <div class="eyebrow">
      <svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 11-14h-7l1-6z"/></svg>
      Enhancement Shaman
    </div>
    <h1>Swing Timer &amp; Sync Visualizer</h1>
  </header>

  <div class="panel">
    <div class="timers">
      <div class="timer-row">
        <div class="timer-head">
          <div class="timer-name"><span class="dot mh"></span>Mainhand</div>
          <div class="readout" id="mh-readout"><b>0.0</b>s / 2.6s</div>
        </div>
        <div class="bar-track" id="mh-track">
          <div class="midline"></div>
          <div class="bar-fill mh" id="mh-fill"></div>
        </div>
        <div class="speed-row">
          <div class="speed-input">
            <input type="number" id="mh-speed" value="2.6" step="0.1" min="0.5" max="6" aria-label="Mainhand weapon speed in seconds">
            <span>sec</span>
          </div>
          <div class="chips" id="mh-chips" data-weapon="mh"></div>
        </div>
      </div>

      <div class="timer-row">
        <div class="timer-head">
          <div class="timer-name"><span class="dot oh"></span>Offhand</div>
          <div class="readout" id="oh-readout"><b>0.0</b>s / 2.6s</div>
        </div>
        <div class="bar-track" id="oh-track">
          <div class="midline"></div>
          <div class="bar-fill oh" id="oh-fill"></div>
        </div>
        <div class="speed-row">
          <div class="speed-input">
            <input type="number" id="oh-speed" value="1.7" step="0.1" min="0.5" max="6" aria-label="Offhand weapon speed in seconds">
            <span>sec</span>
          </div>
          <div class="chips" id="oh-chips" data-weapon="oh"></div>
        </div>
      </div>
    </div>

    <div class="controls-row">
      <button class="ctl-btn" id="toggle-btn">Pause</button>
      <button class="ctl-btn" id="reset-btn">Reset &amp; Sync Both</button>
      <button class="ctl-btn" id="randomize-btn">Randomize Swings</button>
    </div>
  </div>

  <div class="panel sync-panel">
    <button class="sync-btn" id="sync-btn" aria-label="Sync offhand swing timer">
      <svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 11-14h-7l1-6z"/></svg>
      <div class="label">Sync</div>
      <div class="sub">/equip · /equip</div>
    </button>
  </div>
</div>

<script>
  const PRESETS = [2.6, 2.9, 2.7, 2.8, 1.7];

  const state = {
    mh: { speed: 2.6, phaseStart: performance.now(), frozen: null },
    oh: { speed: 1.7, phaseStart: performance.now(), frozen: null },
    running: true,
  };

  function buildChips(weapon) {
    const box = document.getElementById(weapon + '-chips');
    PRESETS.forEach(val => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.textContent = val.toFixed(1);
      b.type = 'button';
      b.addEventListener('click', () => setSpeed(weapon, val, true));
      box.appendChild(b);
    });
  }
  buildChips('mh');
  buildChips('oh');

  function currentProgress(weapon) {
    const s = state[weapon];
    if (s.frozen !== null) return s.frozen;
    const elapsed = (performance.now() - s.phaseStart) / 1000;
    return (elapsed % s.speed) / s.speed;
  }

  function setSpeed(weapon, value, fromChip) {
    const s = state[weapon];
    const frac = currentProgress(weapon);
    s.speed = value;
    document.getElementById(weapon + '-speed').value = value.toFixed(1);
    if (s.frozen !== null) {
      s.frozen = frac;
    } else {
      s.phaseStart = performance.now() - frac * value * 1000;
    }
    highlightChip(weapon, value);
  }

  function highlightChip(weapon, value) {
    const box = document.getElementById(weapon + '-chips');
    [...box.children].forEach(c => {
      const match = Math.abs(parseFloat(c.textContent) - value) < 0.001;
      c.classList.toggle('active', match);
      c.classList.toggle(weapon + '-active', match);
    });
  }

  document.getElementById('mh-speed').addEventListener('change', e => {
    const v = Math.min(6, Math.max(0.5, parseFloat(e.target.value) || 2.6));
    setSpeed('mh', v);
  });
  document.getElementById('oh-speed').addEventListener('change', e => {
    const v = Math.min(6, Math.max(0.5, parseFloat(e.target.value) || 1.7));
    setSpeed('oh', v);
  });

  document.getElementById('toggle-btn').addEventListener('click', () => {
    state.running = !state.running;
    const btn = document.getElementById('toggle-btn');
    if (!state.running) {
      state.mh.frozen = currentProgress('mh');
      state.oh.frozen = currentProgress('oh');
      btn.textContent = 'Resume';
    } else {
      const now = performance.now();
      state.mh.phaseStart = now - state.mh.frozen * state.mh.speed * 1000;
      state.oh.phaseStart = now - state.oh.frozen * state.oh.speed * 1000;
      state.mh.frozen = null;
      state.oh.frozen = null;
      btn.textContent = 'Pause';
    }
  });

  document.getElementById('reset-btn').addEventListener('click', () => {
    const now = performance.now();
    state.mh.phaseStart = now;
    state.oh.phaseStart = now;
    if (state.mh.frozen !== null) state.mh.frozen = 0;
    if (state.oh.frozen !== null) state.oh.frozen = 0;
  });

  document.getElementById('randomize-btn').addEventListener('click', () => {
    const now = performance.now();
    ['mh', 'oh'].forEach(weapon => {
      const s = state[weapon];
      const frac = Math.random();
      if (s.frozen !== null) {
        s.frozen = frac;
      } else {
        s.phaseStart = now - frac * s.speed * 1000;
      }
    });
  });

  const syncBtn = document.getElementById('sync-btn');
  syncBtn.addEventListener('click', () => {
    syncBtn.classList.remove('pressed');
    void syncBtn.offsetWidth;
    syncBtn.classList.add('pressed');

    const progress = currentProgress('oh');
    if (progress > 0.5) {
      const s = state.oh;
      if (s.frozen !== null) {
        s.frozen = 0.5;
      } else {
        s.phaseStart = performance.now() - 0.5 * s.speed * 1000;
      }
    }
  });

  syncBtn.addEventListener('animationend', e => {
    if (e.target === syncBtn) syncBtn.classList.remove('pressed');
  });

  function fmt(weapon) {
    const s = state[weapon];
    const p = currentProgress(weapon);
    const elapsedS = p * s.speed;
    document.getElementById(weapon + '-fill').style.width = (p * 100).toFixed(2) + '%';
    document.getElementById(weapon + '-readout').innerHTML =
      `<b>${elapsedS.toFixed(1)}</b>s / ${s.speed.toFixed(1)}s &nbsp;·&nbsp; ${(p * 100).toFixed(0)}%`;
  }

  function loop() {
    fmt('mh');
    fmt('oh');
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  highlightChip('mh', state.mh.speed);
  highlightChip('oh', state.oh.speed);
</script>
