<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FAQ</title>

  <!-- Shared, uniform header + global tokens -->
  <link rel="stylesheet" href="../header.css"/>

  <!-- MathJax (only if you actually use LaTeX in the markdown) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>

  <!-- Showdown for Markdown → HTML -->
  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js" defer></script>

  <style>
    /* Page-specific styles (mirrors the first page approach) */
    html, body {
      height: 100%;
      margin: 0;
      overflow: visible; /* allow scroll like first page */
    }

    .page-title {
      max-width: 1000px;
      margin: 24px auto 0;
      padding: 0 16px;
      font-family: gilroy, ss, sans-serif;
      font-size: 1.6rem;
      color: var(--title);
      text-align: center;
    }

    /* Markdown container: centered card-like panel */
    .md-wrap {
      max-width: 1000px;
      margin: 20px auto 60px; /* space under header + footer room */
      padding: 0 16px;
    }
    #markdown-content {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 22px;
      line-height: 1.8;
      overflow-x: auto;
    }

    /* Markdown typography */
    #markdown-content h1,
    #markdown-content h2,
    #markdown-content h3,
    #markdown-content h4 {
      color: var(--title);
      margin: 1.2rem 0 .6rem;
      font-family: gilroy, ss, ui-sans-serif, system-ui;
    }
    #markdown-content p { margin: 1rem 0; }
    #markdown-content ul,
    #markdown-content ol {
      margin: .6rem 0 .6rem 1.25rem;
      padding-left: 1rem;
    }
    #markdown-content li { margin: .35rem 0; }

    #markdown-content a { text-decoration: underline; }

    #markdown-content code,
    #markdown-content pre code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .15rem .35rem;
    }
    #markdown-content pre {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .75rem 1rem;
      overflow-x: auto;
    }

    #markdown-content blockquote {
      border-left: 4px solid var(--accent, #1a73e8);
      padding-left: 14px;
      margin: 1rem 0;
      color: var(--muted);
    }

    /* Tables */
    #markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      display: block;      /* wrap in block to enable horizontal scroll on small screens */
      overflow-x: auto;
    }
    #markdown-content th,
    #markdown-content td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    #markdown-content th {
      background: rgba(255,255,255,0.04);
      font-weight: 700;
    }
    #markdown-content img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 10px auto;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- Uniform header (copied structure from the first page) -->
  <header>
    <a class="github-icon" href="https://github.com/rheffelman/rheffelman.github.io">
      <img src="../materials/github-mark-white.png" alt="GitHub icon"/>
    </a>
    <h1><a href="../index.html">rheffelman.github.io</a></h1>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../html/about.html">About Me</a></li>
        <li><a href="../html/projects.html">Projects</a></li>
      </ul>
    </nav>
  </header>

  <!-- Page-specific title OUTSIDE the header to keep header uniform -->
  <div class="page-title">FAQ</div>

  <!-- Markdown content card -->
  <div class="md-wrap">
    <div id="markdown-content">Loading…</div>
  </div>

  <script>
    // Run after Showdown loads
    window.addEventListener('DOMContentLoaded', () => {
      const converter = new showdown.Converter({
        tables: true,
        simplifiedAutoLink: true,
        strikethrough: true,
        tasklists: true
      });

      fetch('../markdowns/FAQ.md')   // adjust path if your FAQ.html lives elsewhere
        .then(r => r.text())
        .then(md => {
          const html = converter.makeHtml(md);
          const el = document.getElementById('markdown-content');
          el.innerHTML = html;

          if (window.MathJax && MathJax.startup) {
            MathJax.startup.promise.then(() => MathJax.typeset([el]));
          }
        })
        .catch(err => {
          console.error('Error fetching Markdown:', err);
          document.getElementById('markdown-content').textContent = 'Failed to load FAQ.md';
        });
    });
  </script>
</body>
</html>
